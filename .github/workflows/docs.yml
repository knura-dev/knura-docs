name: Docs

# Builds the site on every pull request. On main it also publishes to docs.knura.io: GitHub signs
# in to AWS with a short-lived token (no stored AWS keys) as the role deploy/docs-site.yaml makes.
# Publishing is skipped until the repository variables DOCS_ROLE_ARN, DOCS_BUCKET and
# DOCS_DISTRIBUTION_ID are set (Settings > Secrets and variables > Actions > Variables).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # "Last updated" on each page comes from git history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: docs-publish
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: dist/
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.DOCS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload to S3
        env:
          BUCKET: ${{ vars.DOCS_BUCKET }}
        run: |
          # Files in _astro/ have a hash in their name, so browsers may keep them for a year.
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"
          # Everything else changes in place: browsers check again after 5 minutes.
          aws s3 sync dist/ "s3://$BUCKET/" --exclude "_astro/*" --cache-control "public, max-age=300" --delete
          # Remove old hashed files last, so pages still being served never point at a missing one.
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable" --delete
      - name: Clear the CloudFront cache
        env:
          DISTRIBUTION: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Id --output text
