# docs.knura.io: a private S3 bucket behind CloudFront, plus the role GitHub Actions uses to publish
# the site into it without stored AWS keys.
#
# Deploy once, in the knura-web account, in us-east-1 (CloudFront only takes certificates from
# there). It adds DNS records to the knura.io zone in that account, so only deploy it once the
# knura.io name servers point at that zone. See deploy/README.md.
AWSTemplateFormatVersion: "2010-09-09"
Description: docs.knura.io (Starlight site on S3 + CloudFront) and its GitHub publish role

Parameters:
  DomainName:
    Type: String
    Default: docs.knura.io
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The knura.io zone in this account
    Default: Z0482734NY8WQH697WIS
  Repository:
    Type: String
    # GitHub names the repository in its sign-in token with the owner's and repository's numeric
    # IDs too, so a deleted and re-created repo with the same name can't publish.
    Default: knura-dev@337844754/knura-docs@1435164234
  CreateGitHubProvider:
    Type: String
    Description: "false if this account already has GitHub's sign-in provider (token.actions.githubusercontent.com)"
    AllowedValues: ["true", "false"]
    Default: "true"

Conditions:
  MakeProvider: !Equals [!Ref CreateGitHubProvider, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      # Old copies of changed pages are kept for 30 days, so a bad publish can be rolled back.
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              Bool: { aws:SecureTransport: "false" }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Pages are built as claim-a-tag.html but linked as /tags/claim-a-tag: add ".html" back, and
  # "index.html" to a path ending in "/".
  PrettyUrls:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-pretty-urls
      AutoPublish: true
      FunctionConfig:
        Comment: Map /path to /path.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Ref DomainName
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          # Managed policies: CachingOptimized, and SecurityHeadersPolicy (HSTS, nosniff,
          # frame options, referrer policy).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PrettyUrls.FunctionMetadata.FunctionARN
        # Without s3:ListBucket a missing page comes back from S3 as 403; show the 404 page.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  DnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's own zone, the same for every distribution

  DnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS checks GitHub's certificate itself; these are only here for older tooling that wants a value.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: knura-docs-github-publish
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflow runs on main: a pull request can build the site but never publish it.
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:ref:refs/heads/main
      Policies:
        - PolicyName: publish-docs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${SiteBucket.Arn}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  BucketName:
    Description: Set as the GitHub repository variable DOCS_BUCKET
    Value: !Ref SiteBucket
  DistributionId:
    Description: Set as the GitHub repository variable DOCS_DISTRIBUTION_ID
    Value: !Ref Distribution
  RoleArn:
    Description: Set as the GitHub repository variable DOCS_ROLE_ARN
    Value: !GetAtt PublishRole.Arn
  CloudFrontDomain:
    Description: The site's CloudFront address, for testing before DNS
    Value: !GetAtt Distribution.DomainName
